[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "v4-core/=lib/v4-core/",
  "forge-std/=lib/v4-core/lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/"
]
